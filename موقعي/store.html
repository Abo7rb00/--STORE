<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتجر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #0f172a, #020617);
      color: #e5e7eb;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
    }

    body.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    header {
      padding: 80px 20px;
      text-align: center;
      background: radial-gradient(circle at top, #1e293b, #020617);
      position: relative;
    }

    nav.navbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      background: #1e293b;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px 0;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    nav.navbar a {
      color: #e5e7eb;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    nav.navbar a:hover {
      color: #818cf8;
    }

    h1 { font-size: 40px; margin-top: 60px; }

    p { color: #c7d2fe; }

    .products {
      max-width: 1100px;
      margin: 80px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: linear-gradient(180deg, #0f172a, #020617);
      border-radius: 22px;
      padding: 32px;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    .card h3 { color: #818cf8; }

    .buy, .back-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 22px;
      background: #5865F2;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .back-btn {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 999;
      background: #1e293b;
      animation: bounce 1s infinite alternate;
    }

    .back-btn:hover {
      transform: translateY(-5px);
      background: #818cf8;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #1e293b;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">الرئيسية</a>
  <a href="store.html">المتجر</a>
  <a href="https://discord.gg/kBJqQznCbV" target="_blank">Discord <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="Discord" width="16"></a>
</nav>

<a class="back-btn" href="index.html">⬅️ الرئيسية</a>

<header>
  <h1>🛒 المتجر</h1>
  <p>اختر المنتج المناسب لك</p>
</header>

<section class="products">
  <div class="card">
    <h3>منتج 1</h3>
    <p>وصف المنتج</p>
    <p><strong>السعر:</strong> 10$</p>
    <a class="buy" href="https://discord.gg/kBJqQznCbV" target="_blank">شراء</a>
  </div>

  <div class="card">
    <h3>منتج 2</h3>
    <p>وصف المنتج</p>
    <p><strong>السعر:</strong> 20$</p>
    <a class="buy" href="https://discord.gg/kBJqQznCbV" target="_blank">شراء</a>
  </div>
</section>

<footer>
  <p>© 2025 جميع الحقوق محفوظة</p>
</footer>

<script>
  window.onload = () => document.body.classList.add('loaded');
</script>

</body>
</html>
