<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة المشتريات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: linear-gradient(180deg, #0f172a, #020617); color: #e5e7eb; opacity: 0; transform: translateY(20px); transition: all 1s ease; }
    body.loaded { opacity: 1; transform: translateY(0); }
    nav.navbar { position: fixed; top: 0; right: 0; left: 0; background: #1e293b; display: flex; justify-content: center; gap: 30px; padding: 15px 0; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    nav.navbar a { color: #e5e7eb; text-decoration: none; font-weight: 600; transition: color 0.3s; }
    nav.navbar a:hover { color: #818cf8; }
    header { padding: 100px 20px 40px; text-align: center; background: radial-gradient(circle at top, #1e293b, #020617); }
    h1 { font-size: 40px; margin-top: 60px; }
    .cart-items { max-width: 900px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
    .item { background: #0f172a; border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.45); opacity: 0; transform: translateY(20px); animation: slideIn 0.5s forwards; }
    .item h3 { margin: 0; color: #818cf8; }
    .item p { margin: 0; }
    .total { text-align: right; font-size: 22px; margin-top: 20px; font-weight: 700; color: #c7d2fe; }
    .btn-clear, .btn-pay { margin-top: 15px; padding: 12px 28px; border-radius: 14px; font-weight: 700; text-decoration: none; color: #fff; background: #5865F2; transition: background 0.3s; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; margin: 5px; }
    .btn-clear:hover, .btn-pay:hover { background: #818cf8; }
    .payment-section { max-width: 900px; margin: 40px auto; padding: 20px; background: #1e293b; border-radius: 16px; text-align: center; }
    .payment-section h2 { color: #818cf8; margin-bottom: 20px; }
    .payment-options { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    footer { text-align: center; padding: 30px; border-top: 1px solid #1e293b; color: #94a3b8; }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">الرئيسية</a>
  <a href="store.html">المتجر</a>
  <a href="https://discord.gg/kBJqQznCbV" target="_blank">Discord <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="Discord" width="16"></a>
</nav>

<header>
  <h1>🛒 سلة المشتريات</h1>
</header>

<section class="cart-items" id="cartItems">
  <!-- المنتجات ستظهر هنا تلقائياً -->
</section>
<div class="total" id="totalPrice">المجموع الإجمالي: $0</div>

<!-- قسم طرق الدفع -->
<div class="payment-section">
  <h2>طرق الدفع</h2>
  <div class="payment-options">
    <button class="btn-pay" onclick="payWithPayPal()">
      <img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_111x69.jpg" alt="PayPal" width="40">
      الدفع عبر PayPal
    </button>
  </div>
</div>

<footer>
  <p>© 2025 جميع الحقوق محفوظة</p>
</footer>

<script>
window.onload = () => document.body.classList.add('loaded');

let cartItems = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
  const cartContainer = document.getElementById('cartItems');
  const totalContainer = document.getElementById('totalPrice');
  cartContainer.innerHTML = '';
  let total = 0;
  cartItems.forEach((item, index) => {
    total += item.price;
    const div = document.createElement('div');
    div.className = 'item';
    div.style.animationDelay = `${index * 0.1}s`;
    div.innerHTML = `<h3>${item.name}</h3><p>السعر: $${item.price}</p>`;
    cartContainer.appendChild(div);
  });
  totalContainer.textContent = 'المجموع الإجمالي: $' + total;
}

function clearCart() {
  if(confirm('هل تريد مسح جميع المنتجات من السلة؟')) {
    cartItems = [];
    localStorage.setItem('cart', JSON.stringify(cartItems));
    renderCart();
  }
}

function payWithPayPal() {
  if(cartItems.length === 0) { alert('السلة فارغة!'); return; }

  // إنشاء الفورم
  let form = document.createElement('form');
  form.method = 'POST';
  form.action = 'https://www.paypal.com/cgi-bin/webscr';
  form.target = '_blank';

  cartItems.forEach((item, index) => {
    let nameInput = document.createElement('input');
    nameInput.type = 'hidden';
    nameInput.name = `item_name_${index+1}`;
    nameInput.value = item.name;
    form.appendChild(nameInput);

    let amountInput = document.createElement('input');
    amountInput.type = 'hidden';
    amountInput.name = `amount_${index+1}`;
    amountInput.value = item.price;
    form.appendChild(amountInput);
  });

  let businessInput = document.createElement('input');
  businessInput.type = 'hidden';
  businessInput.name = 'business';
  businessInput.value = 'your-paypal-email@example.com'; // ضع بريدك هنا
  form.appendChild(businessInput);

  let cmdInput = document.createElement('input');
  cmdInput.type = 'hidden';
  cmdInput.name = 'cmd';
  cmdInput.value = '_cart';
  form.appendChild(cmdInput);

  let uploadInput = document.createElement('input');
  uploadInput.type = 'hidden';
  uploadInput.name = 'upload';
  uploadInput.value = '1';
  form.appendChild(uploadInput);

  let currencyInput = document.createElement('input');
  currencyInput.type = 'hidden';
  currencyInput.name = 'currency_code';
  currencyInput.value = 'USD';
  form.appendChild(currencyInput);

  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  // مسح السلة بعد إرسال الدفع
  cartItems = [];
  localStorage.setItem('cart', JSON.stringify(cartItems));
  renderCart();
}

renderCart();
</script>

</body>
</html>
