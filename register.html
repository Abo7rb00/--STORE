<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - RMZ Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Cairo',sans-serif;
  background:#000;
  color:#FFD700;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.box{
  background:#111;
  padding:30px;
  border-radius:16px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 25px rgba(255,215,0,0.3);
}
h2{color:#FFD700;}
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:#FFD700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.3s ease, transform 0.2s ease;
}
button:hover{
  background:#FFC700;
  transform:scale(1.05);
}
a{color:#FFD700;text-decoration:none;font-size:14px;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="box">
  <h2>إنشاء حساب</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="register()">إنشاء الحساب</button>
  <p><a href="login.html">لديك حساب؟ تسجيل دخول</a></p>
</div>

<script>
function register(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if(!email || !password){
    alert("املأ جميع الحقول");
    return;
  }

  localStorage.setItem("user", JSON.stringify({email,password}));
  alert("تم إنشاء الحساب ✅");
  window.location.href = "login.html";
}
</script>

</body>
</html>
